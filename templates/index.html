<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spam Detector</title>
    <link rel="stylesheet" href="/static/style.css">
   
    
</head>
<body>
<div class="container">

    <header>
        <h1><i class="fas fa-shield-alt"></i> Spam Detector</h1>
    </header>

    <div class="main-content">

        <form method="POST">
            <label><i class="fas fa-envelope"></i> Email Content:</label>
            <textarea name="message" placeholder="Paste the email content here..." required>{{ message }}</textarea>

            <div class="button-group">
                <button type="submit" name="predict" class="predict-btn">
                    <i class="fas fa-search"></i> Check for Spam
                </button>
                <button type="submit" name="clear" class="clear-btn">
                    <i class="fas fa-eraser"></i> Clear Text
                </button>
            </div>
        </form>

        {% if result %}
            <div class="result-box {% if result == 'Spam' %}spam{% else %}not-spam{% endif %}">
                <h2>
                    {% if result == 'Spam' %}
                        <i class="fas fa-exclamation-triangle"></i> SPAM DETECTED
                    {% else %}
                        <i class="fas fa-check-circle"></i> NOT SPAM
                    {% endif %}
                </h2>
                <!--<p style="margin-top:15px;">{{ result }}</p> -->
            </div>
        {% endif %}

    </div>
</div>
</body>
</html>
